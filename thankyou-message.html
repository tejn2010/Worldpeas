<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Starry Night</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; position:absolute; top:0; left:0; }

   :root{
    --glass-bg: rgba(255, 255, 255, 0.041);
    --glass-border: rgba(255,255,255,0.18);
    --glass-shadow: 0 8px 30px rgba(2,6,23,0.6);
    --accent: rgba(255, 255, 255, 0.333);
  }

  body {
            text-align: center;
  }

   h1 {
            font-size: 50px;
            color: #ffffff;
            margin: 33.5px 0 33.5px 0;
        }
        h3 {
            font-size: 30px;
            color: #ffffff;
            margin: 20px 0 20px 0;
        }

        p {
            font-size: 20px;
            color: #ffffff;
            margin: 20px 0 20px 0;
        }

    div {
           background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
            padding: 50px 70px 50px 70px;
            text-align: center;
            height: 306px;
            width: 500px;
            margin-top: 200px;

           background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);

    /* backdrop blur */
    -webkit-backdrop-filter: blur(1px);
    backdrop-filter: blur(1px);
    

  }
    
</style>
</head>
<body>
<canvas id="sky"></canvas>

<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

// Mouse position
const mouse = { x: W/2, y: H/2 };

// Handle mouse movement
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// Utility
const rand = (min,max) => Math.random()*(max-min)+min;

// Star setup
const stars = [];
const numStars = 800; // dense galaxy
for(let i=0;i<numStars;i++){
  stars.push({
    x: rand(0,W),
    y: rand(0,H),
    radius: rand(0.5,1.5),
    alpha: rand(0.3,1),
    delta: rand(0.002,0.008)
  });
}

// Animation
function animate(){
  ctx.clearRect(0,0,W,H);

  for(let s of stars){
    // twinkle
    s.alpha += s.delta;
    if(s.alpha > 1 || s.alpha < 0.3) s.delta *= -1;

    // parallax effect based on mouse
    const offsetX = (mouse.x - W/2) * 0.02 * (s.radius/1.5);
    const offsetY = (mouse.y - H/2) * 0.02 * (s.radius/1.5);

    ctx.beginPath();
    ctx.arc(s.x + offsetX, s.y + offsetY, s.radius, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.fill();
  }

  requestAnimationFrame(animate);
}
animate();

// Handle window resize
window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;

  // reposition stars randomly
  for(let s of stars){
    s.x = rand(0,W);
    s.y = rand(0,H);
  }
});
</script>
   <div>
        <h1>THANK YOU</h1>
        <p>Thank you for visiting our website!</p>
        <h3>We love to have you.</h3>
    </div>


</body>
</html>
