    <script>
document.addEventListener("DOMContentLoaded", function () {
  let cartItems = document.querySelectorAll(".product-card");
  const subtotalEl = document.querySelector(".summary-item .summary-value"); 
  const totalEl = document.querySelector(".summary-item.total .summary-value");
  const basketBtn = document.querySelector(".basket-btn");
  const itemsCountEl = document.querySelector(".items-count"); 
  const shipping = 3.99;
  const taxRate = 0.08; // 8% tax

  function updateTotals() {
    let subtotal = 0;
    let itemCount = 0;

    cartItems = document.querySelectorAll(".product-card"); // refresh list if items removed

    cartItems.forEach(card => {
      const quantity = parseInt(card.querySelector(".quantity").textContent);
      const pricePerUnit = parseFloat(card.querySelector(".quantity-selector").dataset.price);
      const totalPrice = quantity * pricePerUnit;
      card.querySelector(".total-price").textContent = `$${totalPrice.toFixed(2)}`;

      subtotal += totalPrice;
      itemCount += quantity;
    });

    const tax = subtotal * taxRate;
    const grandTotal = subtotal + (subtotal > 0 ? shipping : 0) + tax;

    subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
    totalEl.textContent = `$${grandTotal.toFixed(2)}`;
    basketBtn.textContent = `Basket (${itemCount})`;   
    itemsCountEl.textContent = `${itemCount} item${itemCount !== 1 ? "s" : ""}`;
  }

  function attachEvents(card) {
    const decreaseBtn = card.querySelector(".decrease");
    const increaseBtn = card.querySelector(".increase");
    const quantityEl = card.querySelector(".quantity");

    decreaseBtn.addEventListener("click", () => {
      let qty = parseInt(quantityEl.textContent);
      qty--;
      if (qty <= 0) {
        card.remove(); // ✅ remove card from DOM
      } else {
        quantityEl.textContent = qty;
      }
      updateTotals();
    });

    increaseBtn.addEventListener("click", () => {
      let qty = parseInt(quantityEl.textContent);
      qty++;
      quantityEl.textContent = qty;
      updateTotals();
    });
  }

  cartItems.forEach(attachEvents);
  updateTotals(); // initial load
});

    <script>

        const vegetables = document.querySelectorAll('.vegetable');

        /**
         * Calculates the offset for each vegetable based on the cursor position
         * to create the parallax effect.
         * @param {number} clientX - The cursor's X coordinate.
         * @param {number} clientY - The cursor's Y coordinate.
         */
        function moveVegetables(clientX, clientY) {
            // Get center of the viewport
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Calculate the difference from the center
            const diffX = clientX - centerX;
            const diffY = clientY - centerY;

            vegetables.forEach(veg => {
                const speed = parseFloat(veg.dataset.speed);
                if (isNaN(speed)) return;

                // Calculate the translation based on cursor difference and speed factor
                const translateX = diffX * speed;
                const translateY = diffY * speed;

                // Apply the transform. For veg-4, we must account for its initial centering transform.
                const initialTransform = veg.classList.contains('veg-4') ? 'translate(-50%, -50%)' : '';
                veg.style.transform = `${initialTransform} translate(${translateX}px, ${translateY}px)`;
            });
        }

        // --- Event Listeners ---

        // 1. Mouse movement for desktop
        document.addEventListener('mousemove', (e) => {
            requestAnimationFrame(() => moveVegetables(e.clientX, e.clientY));
        });

        // 2. Touch movement for mobile devices
        document.addEventListener('touchmove', (e) => {
            // Prevent scrolling while touching and moving
            e.preventDefault(); 
            // Only consider the first touch point
            const touch = e.touches[0];
            if (touch) {
                requestAnimationFrame(() => moveVegetables(touch.clientX, touch.clientY));
            }
        });

        // 3. Handle device orientation for a tilt effect (optional mobile enhancement)
        // This provides an alternative interaction on devices without a mouse
        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null && e.beta !== null) {
                // Use gamma (left-right tilt) for X and beta (front-back tilt) for Y
                // Normalize and scale the tilt values (-180 to 180 for gamma/beta) to cursor-like movement
                const tiltX = (e.gamma / 90) * window.innerWidth / 2 + window.innerWidth / 2;
                const tiltY = (e.beta / 90) * window.innerHeight / 2 + window.innerHeight / 2;
                
                requestAnimationFrame(() => moveVegetables(tiltX, tiltY));
            }
        });

    </script>
</body>
</html>
